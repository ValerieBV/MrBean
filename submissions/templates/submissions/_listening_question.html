<fieldset class="listening-question" id="question-{{ q.id }}" data-question data-number="{{ q.number }}" data-requires-short-answer="{{ q.requires_short_answer|yesno:'true,false' }}">
<legend>Câu {{ q.number }}</legend>
{% if q.question_text %}<p class="listening-question-text">{{ q.question_text }}</p>{% endif %}
{% if q.has_image %}<img src="{% url 'submissions:lesson_image' task.pk q.id %}" alt="Hình câu {{ q.number }}" style="max-height:240px;max-width:100%">{% endif %}
<div class="listening-response-row"><div class="listening-options{% if q.has_printed_options %} detailed{% endif %}">{% for option in q.options %}<label class="listening-option"><input type="radio" name="q_{{ q.id }}" value="{{ option.letter }}" {% if q.selected == option.letter %}checked{% endif %}><span class="listening-option-letter">{{ option.letter }}</span>{% if option.text != option.letter %}<span class="listening-option-text">{{ option.text }}</span>{% endif %}</label>{% endfor %}</div>
<div class="listening-short-response"><label class="listening-answer-label" for="short_{{ q.id }}">Câu trả lời ngắn</label><textarea rows="3" class="listening-answer" id="short_{{ q.id }}" name="s_{{ q.id }}" maxlength="255" placeholder="Ghi nội dung em nghe được…" autocomplete="off">{{ q.short_answer }}</textarea></div></div>
</fieldset>
