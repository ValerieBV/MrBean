{% if jobs %}<section class="bg-white rounded-xl shadow-sm border p-5 mt-6"><h3 class="font-semibold mb-3">Các lần đã nộp</h3><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr><th class="text-left p-3">Ngày nộp</th><th class="text-left p-3">Trạng thái</th><th class="text-left p-3">Điểm cuối cùng</th><th class="text-left p-3">Kết quả</th></tr></thead><tbody>{% for job in jobs %}<tr class="border-t"><td class="p-3">{{ job.submitted_at|date:'d/m/Y H:i' }}</td><td class="p-3">{{ job.public_status }}</td><td class="p-3">{% if job.status == 'graded' %}{{ job.final_score|default_if_none:'—' }}{% else %}—{% endif %}</td><td class="p-3"><a class="text-amber-700 underline" href="{% url 'submissions:result' job.pk %}">Xem kết quả</a></td></tr>{% endfor %}</tbody></table></div></section>{% endif %}
