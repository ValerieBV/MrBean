name: Complete project checks
on:
  pull_request:
    branches: [AI, master]
  push:
    branches: ['codex/mrbean-full-integration']
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python manage.py collectstatic --noinput
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
        env:
          MRBEAN_PYTHON: python
          MRBEAN_QA_OUTPUT: ${{ github.workspace }}/browser-output
      - run: node local_recognition.cjs
        working-directory: tests/browser
        env:
          MRBEAN_PYTHON: python
          MRBEAN_QA_OUTPUT: ${{ github.workspace }}/browser-output/local-recognition
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: browser-output
  local-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-local-ai.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-local-ai.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python manage.py test ai_core.test_local_recognition ai_core.test_local_model_runtime
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
