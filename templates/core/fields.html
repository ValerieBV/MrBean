{{ form.non_field_errors }}<div class="form-grid">{% for field in form %}<div class="form-field" data-field="{{ field.name }}" {% if field.errors %}data-has-errors="true"{% endif %}>{% if field.name == 'first_name' %}<label for="{{ field.id_for_label }}">Họ và tên đệm:</label>{% elif field.name == 'last_name' %}<label for="{{ field.id_for_label }}">Tên:</label>{% else %}{{ field.label_tag }}{% endif %}{{ field }}{% if field.help_text %}<div class="form-help">{{ field.help_text|safe }}</div>{% endif %}{{ field.errors }}</div>{% endfor %}</div>
