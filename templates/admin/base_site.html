{% extends "admin/base.html" %}

{% load static %}{% block title %}{{ title }} | Mr Bean English{% endblock %}

{% block branding %}

{% endblock %}

{% block extrastyle %}{{ block.super }}
<link rel="stylesheet" href="{% static 'core/palette.css' %}?v=20261110-upload2">

<style>
