<form id="filters" class="report-tools" role="search">
<label>Lớp học<select name="classroom"><option value="">Tất cả lớp có quyền xem</option>{% for c in classes %}<option value="{{ c.pk }}">{{ c.class_code }} — {{ c.name }}</option>{% endfor %}</select></label>
<label>Kỹ năng<select name="skill"><option value="">Tất cả kỹ năng</option><option value="listening">Nghe</option><option value="speaking">Nói qua transcript</option><option value="vocabulary">Từ vựng</option></select></label>
<label>Giao từ ngày<input name="date_from" type="date"></label><label>Đến ngày<input name="date_to" type="date"></label><label>Tìm kiếm<input name="q" type="search" placeholder="Tên bài hoặc học viên" maxlength="100"></label><button class="report-button" type="submit">Lọc báo cáo</button>
</form><p id="reportStatus" role="status" class="report-subtle">Đang tải báo cáo…</p>
<div class="report-grid"><div class="report-card">Tỷ lệ nộp bài<strong id="rate">—</strong><span id="counts"></span></div><div class="report-card">Điểm chính thức / 10<strong id="score">—</strong><span>Nghe tự động hoặc giáo viên xác nhận</span></div><div class="report-card">Điểm AI gợi ý / 10<strong id="aiScore">—</strong><span>Đang chờ giáo viên xác nhận</span></div><div class="report-card">{% if is_reporting_staff %}Bài chờ giáo viên{% else %}Bài được giao{% endif %}<strong id="fourth">—</strong><span id="scope"></span></div></div>
