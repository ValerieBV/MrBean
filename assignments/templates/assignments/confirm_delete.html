{% extends 'base_admin.html' %}
{% load static %}{% block title %}Xác nhận xóa{% endblock %}
{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-amber-900/5 p-6 max-w-lg">
    <p class="mb-5 text-gray-700"><i class="fa-solid fa-triangle-exclamation text-amber-500"></i>
        Xóa <b>{{ description }}</b>? Thao tác không thể hoàn tác.</p>
    <form method="post" class="flex space-x-3">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg text-sm font-medium">Xóa</button>
        <a href="{{ back_url }}" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-50 text-sm">Hủy</a>
    </form>
</div>
{% endblock %}
